<!DOCTYPE html>

<!-- 
    1. h1 - h6 : dùng để viết tiêu đề
    2. p - dùng để viể đoạn văn
    3. img - hiển thị hình ảnh
    4. a - anchor - mỏ neo- thẻ đặt để liên kết
    5. ul, li - hiển thị danh sách chứa nhiều phần tử bên trong ---- 
    -- ul hiển thị ra dấu chấm trồn còn ol hiển thị ra số
    6. table - dùng khi kẻ bảng
    7. input
    8.button
    9.div - tạo khối bao quanh

    10 . attribute? nó là thuộc tính của thẻ html nằm trong thẻ mở

    có 3 cách thiết kế css: internal, external, inline

    --internal là sử dụng 1 cặp thẻ style đặt vào trong file html 
    --external là đặt 2 cái file ở ngoài và có đường link dẫn tới file đó
    --inline là sử dụng attribute viết ngay ở trong thẻ đó

 -->

<html>
    <!-- ctrl + / Phần đầu -->
     <head>
        <!-- đây là phần hiển thị tiêu đề khi chạy -->
        <title>WEB TÌM TRỌ</title> 
        <!-- chuyển sang tiếng việt -->
        <meta charset="utf-8">
        <link rel="stylesheet" href="main.css">
     </head>

     <!-- Phần thân -->
     <body>


        <h1 title="Đây là thẻ Attribute">Attribute?</h1>
        <h1 onclick="">Attribute?</h1>
        <!-- ...title và onclick chính là một thẻ của attribute -->
        
        <button>Đăng ký</button>

        <input type="text">
        <input type="check">

        <img src="" alt="">
        <a href=""></a>

        <ul>
            <li></li>
            <li></li>
            <li></li>
        </ul>

        <table>
            <thead>
                <th>STT</th>
                <th>tÊN</th>
                <th>ĐỊA CHỈ</th>
            </thead>

            <tbody>
                <tr>
                    <td>1</td>
                    <td>Ngueyexn Thị Hoài</td>
                    <td>Nghệ An</td>
                </tr>

            </tbody>
        </table>

     </body>
</html>
