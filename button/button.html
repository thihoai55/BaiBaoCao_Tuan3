<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <tittle>BEM</tittle>
    <link rel="stylesheet" href="style_button.css">
</head>

<body>
    <div>
        <button class="btn btn--success btn--size-s">Success</button>
        <button class="btn btn--danger btn--size-s">Danger</button>
        <div class="btn btn--warn btn--size-s">Warn</div>
    </div>

    <div>
        <div class="btn btn--success" disabled>Success</div>
        <div class="btn btn--danger btn--disabled">Danger</div>
        <div class="btn btn--warn">Warn</div>
    </div>

    <div>
        <div class="btn btn--success btn--size-l">Success</div>
        <div class="btn btn--danger btn--size-l">Danger</div>
        <div class="btn btn--warn btn--size-l">Warn</div>
    </div>

</body>
</html>
